esphome:
  name: living-room-ceiling-fan
  friendly_name: Living Room Ceiling Fan

  on_boot:
      priority: -100  # Run after everything is initialized
      then:
        - delay: 1000ms
        - lambda: 'id(lr_system_ready) = true;'
        - lambda: |-
            id(lr_fan_speed_sensor).publish_state(id(lr_fan_speed_state));
            id(lr_fan_light_sensor).publish_state(id(lr_light_state));

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    # Set this to the IP of the ESP
    static_ip: !secret fan_static_ip
    # Set this to the IP address of the router. Often ends with .1
    gateway: !secret network_gateway
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: 255.255.0.0

    dns1: !secret network_gateway

button:
  - platform: restart
    name: "Reboot ESP32"
    icon: "mdi:restart"

switch:
  - platform: template
    name: "Living Room Fan Light"
    icon: "mdi:lightbulb"
    restore_mode: RESTORE_DEFAULT_OFF

    turn_on_action:
      - script.execute: transmit_light
    turn_off_action:
      - script.execute: transmit_light

fan:
  - platform: template
    name: "Living Room Ceiling Fan"
    id: living_room_ceiling_fan
    speed_count: 3  # Low, Med, High

    on_turn_on:
      - lambda: |-
          if (id(living_room_ceiling_fan).speed == 1) {
            id(transmit_low).execute();
          } else if (id(living_room_ceiling_fan).speed == 2) {
            id(transmit_med).execute();
          } else if (id(living_room_ceiling_fan).speed == 3) {
            id(transmit_high).execute();
          }

    on_speed_set:
      then:
        - script.stop: transmit_low
        - script.stop: transmit_med
        - script.stop: transmit_high
        - script.stop: transmit_off
        # Add a tiny delay to let the RF pin settle
        - if:
            condition:
              lambda: 'return id(lr_system_ready);' # ONLY transmit if system is ready
            then:
               - if:
                  condition:
                    lambda: 'return id(living_room_ceiling_fan).state;'
                  then:
                    - lambda: |-
                        if (x == 1) { id(transmit_low).execute(); }
                        else if (x == 2) { id(transmit_med).execute(); }
                        else if (x == 3) { id(transmit_high).execute(); }

    on_turn_off:
       - script.execute: transmit_off
       - lambda: |-
          id(living_room_ceiling_fan).speed = 0;
          id(living_room_ceiling_fan).publish_state();

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# The official CC1101 component
cc1101:
  cs_pin: GPIO5
  frequency: 303.921MHz # 303.875MHz for many UC7080T fans; 303.9MHz for UC-9050T
  modulation_type: ASK/OOK
  # Widened to catch both the remote and wall switch
  filter_bandwidth: 812kHz
  rx_attenuation: 12dB

# Link the CC1101 to the transmitter/receiver
remote_receiver:
  pin: GPIO4
  tolerance: 50%
  filter: 100us
  idle: 4ms
  id: my_remote_receiver
  on_raw:
    - then:
        - lambda: |-
            if (x.size() < 24) return;

            bool booleanArray[25];

            for (int i = 0; i < 25; i++) {
              booleanArray[i] = abs((int)x[i]) > 500;
              yield(); // Tells the ESP to handle WiFi/Background tasks for a moment
            }

            // To decode: if a raw pulse's absolute value is above 500, treat it as a 1,
            // otherwise a 0. e.g. raw sequence 287,-441,599,-774,... becomes
            // 0011001100110101001101010 — from there, look for the bit patterns that
            // are unique to each button on the remote.
            // isLiving excludes cross-talk from a second, similarly-coded fan remote
            // (bedroom) picked up by the same receiver.
            bool isLiving = !booleanArray[0] && !booleanArray[1] && booleanArray[2] && booleanArray[3] && !booleanArray[4] && !booleanArray[5] && booleanArray[6] && booleanArray[7] && !booleanArray[8] && !booleanArray[9] && booleanArray[10] && booleanArray[11] && !booleanArray[12];

            if (!isLiving) return;

            bool isLow = booleanArray[13] && !booleanArray[14] && booleanArray[15] && !booleanArray[16] && !booleanArray[17] && booleanArray[18] && booleanArray[19] && !booleanArray[20] && booleanArray[21] && !booleanArray[22] && booleanArray[23] && !booleanArray[24];
            bool isMed = booleanArray[13] && !booleanArray[14] && !booleanArray[15] && booleanArray[16] && booleanArray[17] && !booleanArray[18] && booleanArray[19] && !booleanArray[20] && booleanArray[21] && !booleanArray[22] && booleanArray[23] && !booleanArray[24];
            bool isHig = !booleanArray[13] && booleanArray[14] && booleanArray[15] && !booleanArray[16] && booleanArray[17] && !booleanArray[18] && booleanArray[19] && !booleanArray[20] && booleanArray[21] && !booleanArray[22] && booleanArray[23] && !booleanArray[24];
            bool isOff = booleanArray[13] && !booleanArray[14] && booleanArray[15] && !booleanArray[16] && booleanArray[17] && !booleanArray[18] && booleanArray[19] && !booleanArray[20] && !booleanArray[21] && booleanArray[22] && booleanArray[23] && !booleanArray[24];
            bool isLit = booleanArray[13] && !booleanArray[14] && booleanArray[15] && !booleanArray[16] && booleanArray[17] && !booleanArray[18] && booleanArray[19] && !booleanArray[20] && booleanArray[21] && !booleanArray[22] && !booleanArray[23] && booleanArray[24];

            int detected = -1;

            if (isHig) {
              ESP_LOGD("fan", "Received: HIGH");
              detected = 3;
            } else if (isOff) {
              ESP_LOGD("fan", "Received: OFF");
              detected = 0;
            } else if(isMed) {
              ESP_LOGD("fan", "Received: MED");
              detected = 2;
            } else if(isLow) {
              ESP_LOGD("fan", "Received: LOW");
              detected = 1;
            } else if (isLit) {
              ESP_LOGD("light", "Received: TOGGLE");
              if (id(lr_light_state) == 5) {
                detected = 4;
              } else {
                detected = 5;
              }
            }

            if (detected < 0) {
              ESP_LOGD("fan", "First 12: %d %d %d %d %d %d %d %d %d %d %d %d", booleanArray[0] && booleanArray[1] && booleanArray[2] && booleanArray[3] && booleanArray[4] && booleanArray[5] && booleanArray[6] && booleanArray[7] && booleanArray[8] && booleanArray[9] && booleanArray[10] && booleanArray[11] && booleanArray[12]);
              return;
            }

            uint32_t now = millis();

            // More than 500ms since the last signal — reset the debounce lock
            if(now - id(lr_last_signal_time) > 500) {
              id(lr_command_accepted) = false;
            }

            if(id(lr_command_accepted) && (now - id(lr_last_signal_time) < 500)) {
              ESP_LOGD("fan", "Ignoring command due to already accepting");
              id(lr_last_signal_time) = now;
              return;
            }

            id(lr_last_signal_time) = now;

            if(detected == id(lr_last_received)) {
              id(lr_receive_count) += 1;
            } else {
              id(lr_last_received) = detected;
              id(lr_receive_count) = 1;
            }

            // Require the same code 3 times in a row before acting on it —
            // cheap noise rejection for a lossy RF channel
            if(id(lr_receive_count) < 3) return;

            id(lr_command_accepted) = true;
            id(lr_receive_count) = 0;
            id(lr_last_received) = -1;

            if (detected == id(lr_light_state) || detected == id(lr_fan_speed_state)) return;

            if (detected < 4) {
              const char* names[] = {"OFF", "LOW", "MED", "HIGH"};
              ESP_LOGD("fan", "Accepted: %s", names[detected]);
              id(lr_fan_speed_state) = detected;
              id(lr_fan_speed_sensor).publish_state(detected);
            } else {
              ESP_LOGD("light", "Accepted: %s", "TOGGLE");
              id(lr_light_state) = detected;
              id(lr_fan_light_sensor).publish_state(detected);
            }

remote_transmitter: # Linked to the CC1101's TX/RX state
  pin: GPIO32
  carrier_duty_percent: 100%
  id: rf_transmitter
  rmt_symbols: 64
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

script:
  - id: transmit_low
    mode: restart # Prevents the script from overlapping with itself
    then:
      - remote_transmitter.transmit_raw:
          code: !secret rf_code_fan_low
          repeat:
            times: 10
            wait_time: 10ms
      - lambda: |-
          if (id(lr_fan_speed_state) != 1) {
            id(lr_fan_speed_state) = 1;
            id(lr_fan_speed_sensor).publish_state(1);
          }
  - id: transmit_med
    mode: restart
    then:
      - remote_transmitter.transmit_raw:
          code: !secret rf_code_fan_med
          repeat:
            times: 10
            wait_time: 10ms
      - lambda: |-
          if (id(lr_fan_speed_state) != 2) {
            id(lr_fan_speed_state) = 2;
            id(lr_fan_speed_sensor).publish_state(2);
          }
  - id: transmit_high
    mode: restart
    then:
      - remote_transmitter.transmit_raw:
          code: !secret rf_code_fan_high
          repeat:
            times: 10
            wait_time: 10ms
      - lambda: |-
          if (id(lr_fan_speed_state) != 3) {
            id(lr_fan_speed_state) = 3;
            id(lr_fan_speed_sensor).publish_state(3);
          }
  - id: transmit_off
    mode: restart
    then:
      - remote_transmitter.transmit_raw:
          code: !secret rf_code_fan_off
          repeat:
            times: 10
            wait_time: 10ms
      - lambda: |-
          if (id(lr_fan_speed_state) != 0) {
            id(lr_fan_speed_state) = 0;
            id(lr_fan_speed_sensor).publish_state(0);
          }
  - id: transmit_light
    mode: restart
    then:
      - remote_transmitter.transmit_raw:
          code: !secret rf_code_light_toggle
          repeat:
            times: 10
            wait_time: 10ms
      - lambda: |-
          if (id(lr_light_state) == 4) {
            id(lr_light_state) = 5;
            id(lr_fan_light_sensor).publish_state(5);
          } else if (id(lr_light_state) == 5) {
            id(lr_light_state) = 4;
            id(lr_fan_light_sensor).publish_state(4);
          }

globals:
  - id: lr_system_ready
    type: bool
    initial_value: 'false'
  - id: lr_fan_speed_state
    type: int
    restore_value: true
    initial_value: '0'
  - id: lr_last_received
    type: int
    initial_value: '-1'
  - id: lr_receive_count
    type: int
    initial_value: '0'
  - id: lr_last_signal_time
    type: uint32_t
    initial_value: '0'
  - id: lr_command_accepted
    type: bool
    initial_value: 'false'
  - id: lr_light_state
    type: int
    restore_value: true
    initial_value: '4'

sensor:
  - platform: template
    name: "Fan Speed State"
    id: lr_fan_speed_sensor
    lambda: return id(lr_fan_speed_state);
    update_interval: never
    accuracy_decimals: 0
  - platform: template
    name: "Fan Light State"
    id: lr_fan_light_sensor
    lambda: return id(lr_light_state);
    update_interval: never
    accuracy_decimals: 0
  # Tracks the WiFi signal strength in dBm
  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: "diagnostic"
  # Converts the dBm signal into a more readable percentage
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Percentage"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"

binary_sensor:
  # Simple Online/Offline status
  - platform: status
    name: "Fan Controller Status"
